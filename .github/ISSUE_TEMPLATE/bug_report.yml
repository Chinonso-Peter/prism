name: Bug report
description: Report something in the explorer, indexer or contracts that is not working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem. Include a transaction hash or contract ID if one is involved.
      placeholder: |
        1. Open the transaction page for ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - Frontend (explorer UI)
        - Indexer
        - Contracts
        - Docker / docker-compose
        - Docs or CI
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network
      description: Which Stellar network were you using?
      options:
        - Testnet
        - Mainnet
        - Local / custom network
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: RPC or Horizon endpoint
      description: The Soroban RPC or Horizon URL you were connected to. Leave blank if you used the defaults.
      placeholder: https://soroban-testnet.stellar.org

  - type: input
    id: version
    attributes:
      label: Commit or version
      description: The commit SHA or release tag you ran, for example the output of `git rev-parse --short HEAD`.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, operating system, browser, and how you ran the project (npm run dev, docker compose, or a deployed host).
      placeholder: |
        - Node: 20.x
        - OS: macOS 15
        - Browser: Chrome 130
        - Run with: docker compose up

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant console, server or indexer output. Remove any secrets, such as values from `.env` files.
      render: shell
