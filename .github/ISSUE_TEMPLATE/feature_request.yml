name: Feature request
description: Suggest an explorer view, indexer capability, or other improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please search existing issues first, and look for `good first issue` or `help wanted` if you want to work on it yourself.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Prism to do? Mention any screens, endpoints or data it would need.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, including workarounds you already use.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (explorer UI)
        - Indexer
        - Contracts
        - Docs or CI
    validations:
      required: true
